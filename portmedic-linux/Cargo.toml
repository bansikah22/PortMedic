[package]
name = "portmedic-linux"
version = "0.1.0"
edition = "2021"
description = "PortMedic for Linux: find and terminate processes occupying development ports."
license = "MIT"
publish = false

# Kept dependency-light on purpose, mirroring the macOS build's "small trusted
# computing base" principle: no third-party crate for /proc parsing or process
# signaling, only for the GUI shell and system tray.
[dependencies]
iced = { version = "0.13", features = ["tokio"] }
gtk = "0.18"
nix = { version = "0.29", features = ["signal"] }
tokio = { version = "1", features = ["time"] }
tray-icon = "0.19"
global-hotkey = "0.8"
dark-light = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
# Used only by unit tests for the /proc parser and PID-safety checks.
