name: Release (Linux)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (for example v1.0.0)
        required: true

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: portmedic-linux

jobs:
  release:
    name: Build and publish Linux release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev \
            libgtk-3-dev libxkbcommon-dev libx11-dev libxcb1-dev libwayland-dev \
            libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "value=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked --verbose

      - name: Package release
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          PACKAGE="PortMedic-linux-${VERSION}"
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE/assets" "$PACKAGE/scripts"
          cp target/release/portmedic-linux "$PACKAGE/portmedic-linux"
          cp assets/portmedic.png "$PACKAGE/assets/portmedic.png"
          cp com.portmedic.PortMedic.desktop "$PACKAGE/com.portmedic.PortMedic.desktop"
          cp scripts/install-desktop.sh "$PACKAGE/scripts/install-desktop.sh"
          chmod +x "$PACKAGE/portmedic-linux" "$PACKAGE/scripts/install-desktop.sh"
          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
          sha256sum "$PACKAGE.tar.gz" > "$PACKAGE.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortMedic-linux-${{ steps.version.outputs.value }}
          path: |
            portmedic-linux/PortMedic-linux-*.tar.gz
            portmedic-linux/PortMedic-linux-*.tar.gz.sha256
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            portmedic-linux/PortMedic-linux-*.tar.gz
            portmedic-linux/PortMedic-linux-*.tar.gz.sha256