name: Release (Linux)

on:
  push:
    tags: ["linux-v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (for example v1.0.0)
        required: true

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: portmedic-linux

jobs:
  release:
    name: Build and publish Linux release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev \
            libgtk-3-dev libxkbcommon-dev libx11-dev libxcb1-dev libwayland-dev \
            libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "value=${VERSION#linux-v}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked --verbose

      - name: Package release
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          PACKAGE="PortMedic-linux-${VERSION}"
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE/assets" "$PACKAGE/scripts"
          cp target/release/portmedic-linux "$PACKAGE/portmedic-linux"
          cp assets/portmedic.png "$PACKAGE/assets/portmedic.png"
          cp com.portmedic.PortMedic.desktop "$PACKAGE/com.portmedic.PortMedic.desktop"
          cp scripts/install-desktop.sh "$PACKAGE/scripts/install-desktop.sh"
          chmod +x "$PACKAGE/portmedic-linux" "$PACKAGE/scripts/install-desktop.sh"
          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
          sha256sum "$PACKAGE.tar.gz" > "$PACKAGE.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortMedic-linux-${{ steps.version.outputs.value }}
          path: |
            portmedic-linux/PortMedic-linux-*.tar.gz
            portmedic-linux/PortMedic-linux-*.tar.gz.sha256
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          PACKAGE="portmedic-linux/PortMedic-linux-${VERSION}"
          ASSETS=("$PACKAGE.tar.gz" "$PACKAGE.tar.gz.sha256")

          # The release may already exist when this job is rerun after a
          # transient GitHub API timeout. Keep the operation idempotent.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if ! gh release create "$RELEASE_TAG" \
              --draft \
              --generate-notes \
              --verify-tag \
              --title "PortMedic Linux $VERSION"; then
              gh release view "$RELEASE_TAG" >/dev/null
            fi
          fi

          for attempt in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber; then
              exit 0
            fi
            echo "Release asset upload attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to upload Linux release assets after 5 attempts" >&2
          exit 1
