name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (for example v1.0.0)
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PROJECT: PortMedic.xcodeproj
  SCHEME: PortMedic

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Select Xcode
        run: |
          XCODE_PATH="/Applications/Xcode_16.4.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "Error: Xcode 16.4 not found at $XCODE_PATH"
            ls /Applications | grep "Xcode" || true
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH"

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "value=${VERSION#v}" >> "$GITHUB_OUTPUT"

      # Unsigned build: distributing a signed and notarised app requires a
      # Developer ID certificate, which must be supplied as repository secrets.
      # See docs/RELEASING.md for enabling signing.
      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      # DMG is the standard macOS distribution format: it lets users drag the
      # app into /Applications instead of unzipping into an arbitrary folder.
      - name: Package app as DMG
        run: |
          APP_PATH="build/Build/Products/Release/PortMedic.app"
          test -d "$APP_PATH" || { echo "App not found at $APP_PATH"; exit 1; }

          # Ad-hoc signing (no Apple Developer account, free): a fully
          # unsigned app downloaded from a browser is hard-blocked by
          # Gatekeeper as "damaged" with no bypass. An ad-hoc signature
          # downgrades that to the dismissible "unidentified developer"
          # prompt (right-click > Open).
          codesign --force --deep --sign - "$APP_PATH"

          STAGING_DIR="dmg-staging"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"
          ditto "$APP_PATH" "$STAGING_DIR/PortMedic.app"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create -volname "PortMedic" -srcfolder "$STAGING_DIR" \
            -ov -format UDZO "PortMedic-${{ steps.version.outputs.value }}.dmg"

      - name: Generate checksum
        run: |
          shasum -a 256 "PortMedic-${{ steps.version.outputs.value }}.dmg" \
            > "PortMedic-${{ steps.version.outputs.value }}.dmg.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: PortMedic-${{ steps.version.outputs.value }}
          path: |
            PortMedic-*.dmg
            PortMedic-*.dmg.sha256
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            PortMedic-*.dmg
            PortMedic-*.dmg.sha256
