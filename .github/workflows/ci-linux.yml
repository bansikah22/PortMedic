name: CI (Linux)

on:
  push:
    branches: [main]
    paths: ["portmedic-linux/**", ".github/workflows/ci-linux.yml"]
  pull_request:
    branches: [main]
    paths: ["portmedic-linux/**", ".github/workflows/ci-linux.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: portmedic-linux

jobs:
  build-and-test:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # tray-icon (via glib-sys/gtk) and iced's windowing backend link
      # against system libraries that Ubuntu runners don't ship by default.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev \
            libgtk-3-dev libxkbcommon-dev libx11-dev libxcb1-dev libwayland-dev \
            libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            portmedic-linux/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('portmedic-linux/Cargo.lock', 'portmedic-linux/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose
